name: Sync meta branch

on:
  schedule:
    - cron: "0 1 * * *"        # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:             # 允许手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Clone source repo (meta branch)
        run: |
          set -euo pipefail
          rm -rf /tmp/src
          git clone --depth 1 --branch meta https://github.com/MetaCubeX/meta-rules-dat.git /tmp/src

      - name: Build meta branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan meta
          git rm -rf . || true
          rsync -a --delete --exclude='.git' /tmp/src/geo-lite ./
          rsync -a --delete --exclude='.git' /tmp/src/geo ./
          git add -A
          if git diff --cached --quiet; then
            echo "meta: no changes"
          else
            git commit -m "Sync meta branch $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push -f origin meta
          fi

      - name: Generate loon rules
        run: |
          set -euo pipefail
          rm -rf /tmp/loon
          mkdir -p /tmp/loon

          # --- IP 规则 (geoip) ---
          for base in geo-lite/geoip geo/geoip; do
            cd "/tmp/src/$base"
            find . -type f -name '*.list' -print0 | while IFS= read -r -d '' f; do
              rel="${f#./}"
              out="/tmp/loon/$base/$rel"
              mkdir -p "$(dirname "$out")"
              awk '{
                if (index($0, ",") > 0) {
                  addr = substr($0, index($0, ",") + 1)
                } else {
                  addr = $0
                }
                if (index(addr, ":") > 0)
                  printf "IP-CIDR6,%s,no-resolve\n", addr
                else
                  printf "IP-CIDR,%s,no-resolve\n", addr
              }' "$f" > "$out"
            done
          done

          # --- 域名规则 (geosite) ---
          for base in geo-lite/geosite geo/geosite; do
            cd "/tmp/src/$base"
            find . -type f -name '*.list' -print0 | while IFS= read -r -d '' f; do
              rel="${f#./}"
              out="/tmp/loon/$base/$rel"
              mkdir -p "$(dirname "$out")"
              awk '{
                line = $0
                if (index(line, "+.") == 1) {
                  printf "DOMAIN-SUFFIX,%s\n", substr(line, 3)
                } else if (index(line, "DOMAIN-SUFFIX,") == 1) {
                  print line
                } else if (index(line, "DOMAIN,") == 1) {
                  print line
                } else {
                  printf "DOMAIN,%s\n", line
                }
              }' "$f" > "$out"
            done
          done

          echo "Generated $(find /tmp/loon -type f | wc -l) files"

      - name: Build loon branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan loon
          git rm -rf . || true
          rsync -a --delete --exclude='.git' /tmp/loon/ ./
          git add -A
          if git diff --cached --quiet; then
            echo "loon: no changes"
          else
            git commit -m "Sync loon rules $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push -f origin loon
          fi

  # ====================================================================
  # 新增任务：合并三个仓库的 fake-ip filter 列表，写入 main 分支 mihomo/ 目录
  # ====================================================================
  fakeip-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Download fake-ip filter lists
        run: |
          set -euo pipefail
          mkdir -p /tmp/fakeip
          curl -fsSL -o /tmp/fakeip/1_shellcrash.list \
            "https://raw.githubusercontent.com/juewuy/ShellCrash/dev/public/fake_ip_filter.list"
          curl -fsSL -o /tmp/fakeip/2_openclash.list \
            "https://raw.githubusercontent.com/vernesong/OpenClash/master/luci-app-openclash/root/etc/openclash/custom/openclash_custom_fake_filter.list"
          curl -fsSL -o /tmp/fakeip/3_clashrules.list \
            "https://raw.githubusercontent.com/wwqgtxx/clash-rules/release/fakeip-filter.list"

      - name: Merge, deduplicate and write to mihomo/
        run: |
          set -euo pipefail
          mkdir -p mihomo
          awk '!seen[$0]++' \
            /tmp/fakeip/1_shellcrash.list \
            /tmp/fakeip/2_openclash.list \
            /tmp/fakeip/3_clashrules.list \
            > mihomo/fakeip-filter.list

      - name: Commit and push to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mihomo/fakeip-filter.list
          if git diff --cached --quiet; then
            echo "fakeip-filter: no changes"
          else
            git commit -m "Update fakeip-filter.list $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD
          fi
